esphome:
  name: test-wifi-connectivity
  friendly_name: test-wifi-connectivity
  min_version: 2026.7.3

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret Minimal-Wifi-Test_api_key

ota:
  platform: esphome
  password: !secret Minimal-Wifi-Test_ota_password # replace with your password

web_server:
  port: 80
  auth:
    type: digest
    username: !secret Minimal-Wifi-Test_web_username
    password: !secret Minimal-Wifi-Test_web_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Test Fallback Hotspot"

captive_portal:

sensor:
  - platform: uptime
    name: Uptime
    entity_category: DIAGNOSTIC

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: DIAGNOSTIC
